# Project-wide Gradle settings.

kotlin.code.style=official

# This machine has no Xcode/macOS toolchain, so the iOS Kotlin/Native targets
# (iosArm64, iosSimulatorArm64, iosX64) declared in build.gradle.kts can't be built here —
# expected on Linux dev machines, not an error. Silences the disabled-targets warning that
# otherwise surfaces on every build of QuickStore (which includes this module via
# includeBuild), since Gradle properties don't cross a composite build boundary on their own.
kotlin.native.ignoreDisabledTargets=true
